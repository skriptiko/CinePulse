packages:
  - "apps/*"
  - "packages/*"
  - "functions"

# Single source of versions shared across workspace packages (`"catalog:"` in package.json).
# functions/ stays on plain ranges: Cloud Build installs it with npm, which has no catalog protocol.
catalog:
  "@fontsource-variable/geist": ^5.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router-dom: ^7.18.5
  "@tanstack/react-query": ^5.62.14
  react-error-boundary: ^6.1.6
  zustand: ^5.0.16
  firebase: ^13.1.0
  sonner: ^2.0.8
  lucide-react: ^1.8.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^24.0.0
  typescript: ^7.0.2
  vite: ^8.3.8
  "@vitejs/plugin-react": ^6.3.0
  # Vite 8 needs 1.12+; its runtime is why the host budget is 222 kB (ADR-0018).
  "@module-federation/vite": ~1.24.1
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  vitest: ^5.1.1
  "@vitest/coverage-v8": ^5.1.1
  jsdom: ^31.0.1
  msw: ^3.0.3
  "@testing-library/react": ^16.3.3
  "@testing-library/dom": ^10.4.2
  "@testing-library/user-event": ^14.6.8
  "@testing-library/jest-dom": ^7.0.1
  axe-core: ^4.14.0
