packages:
  - "apps/*"
  - "packages/*"
  - "functions"

# Single source of versions shared across workspace packages (`"catalog:"` in package.json).
# functions/ stays on plain ranges: Cloud Build installs it with npm, which has no catalog protocol.
catalog:
  react: ^18.3.1
  react-dom: ^18.3.1
  react-router-dom: ^7.13.0
  "@tanstack/react-query": ^5.62.14
  lucide-react: ^1.8.0
  "@types/react": ^18.3.18
  "@types/react-dom": ^18.3.5
  "@types/node": ^24.0.0
  typescript: ^5.7.3
  vite: ^5.4.14
  "@vitejs/plugin-react": ^4.3.4
  "@module-federation/vite": ^1.11.0
  "@module-federation/dts-plugin": ^0.11.0
  tailwindcss: ^3.4.17
  postcss: ^8.4.49
  autoprefixer: ^10.4.20
