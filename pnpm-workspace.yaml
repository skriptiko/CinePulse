packages:
  - "apps/*"
  - "packages/*"
  - "functions"

# Single source of versions shared across workspace packages (`"catalog:"` in package.json).
# functions/ stays on plain ranges: Cloud Build installs it with npm, which has no catalog protocol.
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router-dom: ^7.13.0
  "@tanstack/react-query": ^5.62.14
  react-error-boundary: ^6.1.6
  sonner: ^2.0.8
  lucide-react: ^1.8.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^24.0.0
  typescript: ^5.7.3
  vite: ^5.4.14
  "@vitejs/plugin-react": ^4.3.4
  "@module-federation/vite": ^1.11.0
  "@module-federation/dts-plugin": ^0.11.0
  tailwindcss: ^3.4.17
  postcss: ^8.4.49
  autoprefixer: ^10.4.20
  vitest: ^3.2.7
  "@vitest/coverage-v8": ^3.2.7
  jsdom: ^30.1.3
  msw: ^3.0.3
  "@testing-library/react": ^16.3.3
  "@testing-library/dom": ^10.4.2
  "@testing-library/user-event": ^14.6.8
  "@testing-library/jest-dom": ^7.0.1
  axe-core: ^4.14.0
