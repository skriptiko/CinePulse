name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - develop
  pull_request:

env:
  NODE_VERSION: '24'

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from packageManager in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Bundle budget (.size-limit.json). Separate from `quality` and not a required check:
  # an over-budget build is a signal to review, not a merge blocker.
  size:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build host
        run: pnpm turbo build --filter=@repo/host

      - name: Check bundle size
        run: pnpm size

  rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test Firestore rules
        run: pnpm dlx firebase-tools@15.18.0 emulators:exec --project demo --only firestore "pnpm exec vitest run --config firestore/vitest.config.ts"

  # Smoke scenarios on the merged dist/ (docs/05-testing/TEST_STRATEGY.md), for PRs into main only.
  e2e:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and merge dist
        run: pnpm build:deploy

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm test:e2e
        env:
          FIREBASE_CLI: pnpm dlx firebase-tools@15.18.0 emulators:start --project demo --only hosting,auth,firestore

  # Two jobs, so that the code of a PR, dependencies included, never shares a machine with the deploy
  # key. A person's pushes only: a fork has no secrets, and nobody reads a bot's update first.
  preview-build:
    needs: [quality, rules]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A new push must not lose the race to the deploy against the one before it.
    concurrency:
      group: preview-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and merge dist
        run: pnpm build:deploy

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Runs nothing from the PR but the files it serves: firebase.json comes from the base branch, as
  # a PR could otherwise put a predeploy command next to the key.
  preview:
    needs: preview-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: preview-dist
          path: dist

      # With no channelId the action names the channel after the PR and comments its link there.
      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: cinepulse-eec15
          target: production
          expires: 7d

  build-and-deploy:
    needs: [quality, rules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never run two production deploys at once; a newer push waits for the current one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same command as locally: builds everything except the apps/design sandbox, then merges dist/.
      - name: Build and merge dist
        run: pnpm build:deploy

      # Functions first: the hosting rewrite /api/tmdb/** points at tmdbProxy.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Functions
        run: pnpm dlx firebase-tools@15.18.0 deploy --only functions --project cinepulse-eec15 --non-interactive --force

      - name: Deploy Firestore rules
        run: pnpm dlx firebase-tools@15.18.0 deploy --only firestore:rules --project cinepulse-eec15 --non-interactive

      - name: Deploy to Production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: cinepulse-eec15
          target: production
          channelId: live
